<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="随手记">
<meta name="theme-color" content="#f5f6fa">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>随手记</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;}
:root{
  --bg:#f5f6fa;--card:#fff;--text:#1c1c1e;--sub:#8e8e93;
  --line:rgba(0,0,0,.08);--primary:#007aff;--red:#ff3b30;--green:#34c759;
  --primary-bg:rgba(0,122,255,.12);--red-bg:rgba(255,59,48,.1);--green-bg:rgba(52,199,89,.12);
  --tabbar:rgba(248,248,250,.92);--sheet:rgba(250,250,252,.98);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#000;--card:#1c1c1e;--text:#f2f2f7;--sub:#8e8e93;--line:rgba(255,255,255,.12);--primary:#0a84ff;--primary-bg:rgba(10,132,255,.2);--red-bg:rgba(255,69,58,.15);--green-bg:rgba(48,209,88,.15);--tabbar:rgba(28,28,30,.92);--sheet:rgba(30,30,32,.98);}
}
html,body{height:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;background:var(--bg);color:var(--text);}
header{position:sticky;top:0;z-index:40;background:var(--bg);padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--line);}
.h-inner{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;min-height:48px;}
.h-title{font-size:20px;font-weight:700;}
.h-nav{display:flex;align-items:center;gap:8px;}
.h-nav button{border:none;background:var(--card);width:34px;height:36px;border-radius:12px;font-size:18px;color:var(--primary);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.h-date-pill{display:flex;align-items:center;gap:2px;background:var(--card);border-radius:12px;padding:2px 10px;box-shadow:0 1px 3px rgba(0,0,0,.06);height:36px;}
.h-date-pill select{border:none;background:transparent;color:var(--text);font-size:15px;font-weight:700;padding:0 4px;text-align:center;-webkit-appearance:none;appearance:none;max-width:76px;}
.h-nav .h-date-pill .h-pill-sep{color:var(--sub);font-size:13px;font-weight:400;}
.h-nav .h-today{width:auto;padding:0 13px;font-size:13px;font-weight:600;background:var(--primary);color:#fff;}
#monthLabel{font-size:15px;font-weight:600;min-width:100px;text-align:center;}
.h-sub{font-size:12px;color:var(--sub);margin-top:2px;}
main{padding:12px 16px calc(100px + env(safe-area-inset-bottom));}
.page{display:none;}
.page.active{display:block;}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.card h3{font-size:15px;font-weight:600;margin-bottom:10px;}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.card-h h3{margin-bottom:0;}
.mini-seg{display:flex;background:var(--bg);border-radius:10px;padding:2px;}
.mini-btn{padding:5px 12px;border:none;border-radius:8px;background:transparent;font-size:12px;color:var(--sub);font-weight:600;cursor:pointer;}
.mini-btn.active{background:var(--primary);color:#fff;}
.card p{font-size:13px;color:var(--sub);line-height:1.6;}
/* 记账 */
.amount-wrap{display:flex;align-items:center;justify-content:center;gap:6px;padding:18px 16px 4px;}
.amount-wrap .sym{font-size:30px;font-weight:600;color:var(--sub);}
.amount-wrap input{font-size:46px;font-weight:700;width:58%;text-align:center;background:transparent;border:none;outline:none;color:var(--text);}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;margin:10px 0 14px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.stat-range{display:flex;align-items:center;gap:8px;}
.stat-range .seg{flex:0 0 auto;margin:0;}
.stat-range .seg-btn{flex:1;padding:8px 14px;border-radius:10px;border:none;background:transparent;font-size:14px;color:var(--sub);font-weight:600;cursor:pointer;}
.stat-range .seg-btn.active{background:var(--primary);color:#fff;}
.stat-range select{border:none;background:transparent;color:var(--text);font-size:15px;font-weight:700;padding:0 4px;text-align:center;-webkit-appearance:none;appearance:none;max-width:76px;}
.stat-range .stat-today{flex:0 0 auto;padding:8px 14px;border:none;border-radius:12px;background:var(--primary);color:#fff;font-size:13px;font-weight:600;}
.seg select{flex:1;padding:8px;border-radius:10px;border:none;background:var(--bg);font-size:14px;color:var(--text);margin:2px;}
.seg button{flex:1;padding:10px;border-radius:10px;border:none;background:transparent;font-size:15px;color:var(--sub);font-weight:500;}
.seg button.active{background:var(--primary);color:#fff;font-weight:600;}
.budget-row{display:flex;gap:8px;align-items:center;margin-bottom:10px;}
.budget-row input{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:15px;}
.budget-bar{height:10px;border-radius:6px;background:var(--bg);overflow:hidden;margin-bottom:8px;}
.budget-bar .bfill{height:100%;border-radius:6px;background:var(--primary);transition:width .3s;}
.budget-info{font-size:13px;color:var(--dim);}
.amt-hint{font-size:12px;color:var(--sub);text-align:center;margin-top:4px;}
.amt-inline{display:flex;gap:6px;margin-left:8px;}
.amt-inline button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--primary);font-size:17px;font-weight:700;line-height:1;cursor:pointer;}
.amt-inline button:active{background:var(--primary-bg);}
.field .field-sub{margin-top:8px;}
.amt-ops button:active{background:var(--primary-bg);}
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.cat-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0 10px;background:var(--card);border-radius:14px;border:2px solid transparent;cursor:pointer;}
.cat-item.active{border-color:var(--primary);background:var(--primary-bg);}
.cat-item .ci{font-size:26px;}
.cat-item .cn{font-size:12px;color:var(--sub);}
.cat-item.active .cn{color:var(--primary);font-weight:600;}
.field{margin:12px 0;}
.field label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px;}
.field input,.field textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:16px;color:var(--text);outline:none;}
.field input:focus,.field textarea:focus{border-color:var(--primary);}
.auto-tip{font-size:13px;color:var(--primary);min-height:18px;margin:2px 2px 8px;}
.btn-primary{width:100%;padding:15px;border:none;border-radius:14px;background:var(--primary);color:#fff;font-size:17px;font-weight:600;cursor:pointer;}
.btn-primary.small{width:auto;padding:10px 18px;font-size:14px;border-radius:12px;}
.btn-ghost{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font-size:14px;cursor:pointer;margin-top:8px;}
.btn-ghost.danger{color:var(--red);border-color:var(--red-bg);}
.btn-ghost.small{width:auto;padding:8px 14px;font-size:13px;border-radius:10px;margin:6px 6px 0 0;}
.row2{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.row2 .btn-ghost{flex:1;margin-top:0;}
/* 列表 */
.month-sum{display:flex;justify-content:space-around;padding:14px 8px;}
.month-sum .ms{text-align:center;}
.month-sum .lbl{display:block;font-size:12px;color:var(--sub);margin-bottom:4px;}
.month-sum .val{font-size:20px;font-weight:700;}
.red{color:var(--red);}.green{color:var(--green);}
.chips{display:flex;gap:8px;margin-bottom:10px;}
.chip{padding:7px 16px;border-radius:20px;border:none;background:var(--card);color:var(--sub);font-size:13px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04);}
.chip.active{background:var(--primary);color:#fff;font-weight:600;}
.search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:14px;color:var(--text);outline:none;margin-bottom:12px;}
.search:focus{border-color:var(--primary);}
.search-row{display:flex;align-items:center;gap:6px;margin-bottom:10px;}
.search-row select{flex:1;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font-size:14px;-webkit-appearance:none;appearance:none;}
.amt-filter{width:64px;padding:9px 8px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font-size:14px;text-align:center;}
.amt-tilde{color:var(--sub);font-size:13px;}
.cat-mgr{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin:10px 0 12px;}
.cat-item.cat-mgr-item-grid{border:2px dashed var(--line);color:var(--sub);}
.cat-item.cat-mgr-item-grid .cn{color:var(--sub);}
.cat-mgr-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
.cat-mgr-item{display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:20px;font-size:14px;background:var(--bg);}
.cat-mgr-item .del{color:#e74c3c;font-size:12px;padding:0 2px;border:none;background:none;cursor:pointer;}
.cat-mgr-add{display:flex;gap:6px;}
.cat-emoji-box{margin-top:10px;}
.cat-emoji-title{font-size:12px;color:var(--sub);margin-bottom:6px;}
.cat-emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;}
.cat-emoji{display:flex;align-items:center;justify-content:center;height:36px;font-size:20px;background:var(--bg);border:1px solid var(--line);border-radius:8px;cursor:pointer;}
.cat-emoji.active{border-color:var(--primary);background:var(--primary-bg);}
.cat-mgr-item .ic{border:none;background:none;font-size:18px;cursor:pointer;padding:0 2px;}
.cat-mgr-item .nm{flex:1;}
.cat-mgr-add input{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:var(--bg);color:var(--text);min-width:0;}
.day-group{margin-bottom:8px;}
.day-head{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--sub);padding:10px 4px 4px;}
.day-head .ds{font-weight:600;color:var(--text);font-size:14px;}
.day-head .dv{font-size:12px;}
.tx-row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer;}
.tx-row:last-child{border-bottom:none;}
.tx-ic{width:38px;height:38px;border-radius:12px;background:var(--primary-bg);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
.tx-main{flex:1;min-width:0;}
.tx-merchant{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tx-note{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tx-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0;margin-left:auto;}
.tx-amt{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;}
.tx-time{font-size:11px;color:var(--sub);}
.h-nav select{font-size:16px;font-weight:600;color:var(--text);}
.empty{text-align:center;color:var(--sub);padding:60px 0;font-size:14px;}
/* tabbar */
.tabbar{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--tabbar);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:50;}
.tab{flex:1;padding:8px 0 5px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--sub);font-size:10px;border:none;background:transparent;cursor:pointer;}
.tab.active{color:var(--primary);}
.tab .ic{font-size:22px;}
/* 导入 */
.tip p{margin-bottom:6px;}
textarea{width:100%;min-height:130px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:13px;color:var(--text);outline:none;font-family:ui-monospace,Menlo,monospace;resize:vertical;}
textarea:focus{border-color:var(--primary);}
.or{text-align:center;color:var(--sub);font-size:12px;margin:10px 0;}
.pv-card{border:1px solid var(--primary);}
.pv-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0;}
.pv-cell{background:var(--primary-bg);border-radius:10px;padding:8px;text-align:center;}
.pv-cell .pv-n{font-size:16px;font-weight:700;color:var(--primary);}
.pv-cell .pv-l{font-size:11px;color:var(--sub);}
.pv-list{max-height:260px;overflow-y:auto;margin-top:10px;border-top:1px solid var(--line);}
details{margin-top:4px;}
details summary{font-size:14px;font-weight:600;color:var(--text);padding:12px 4px;cursor:pointer;list-style:none;}
details summary::before{content:"▸ ";color:var(--sub);}
details[open] summary::before{content:"▾ ";}
.rule-row{display:flex;align-items:center;justify-content:space-between;padding:9px 6px;border-bottom:1px solid var(--line);font-size:14px;}
.rule-row .rk{font-weight:600;}
.rule-row .rc{color:var(--primary);}
.rule-row .rd{color:var(--red);border:none;background:none;font-size:13px;cursor:pointer;padding:2px 6px;}
/* 统计 */
.stat-3{display:flex;justify-content:space-between;text-align:center;}
.stat-3>div{flex:1;}
.stat-3 .lbl{display:block;font-size:12px;color:var(--sub);margin-bottom:4px;}
.stat-3 .big{font-size:18px;font-weight:700;}
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:8px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;}
.bar{width:70%;max-width:26px;background:var(--primary);border-radius:5px 5px 2px 2px;min-height:2px;}
.bar-col .bl{font-size:10px;color:var(--sub);}
.bar-col .bv{font-size:10px;color:var(--sub);}
.line-chart{position:relative;width:100%;height:150px;padding-top:8px;}
.line-chart svg{width:100%;height:100%;overflow:visible;}
.line-chart .ln{fill:none;stroke:var(--primary);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
.line-chart .ln-area{fill:var(--primary-bg);stroke:none;}
.line-chart .dot{fill:var(--primary);stroke:#fff;stroke-width:1.5;}
.line-chart .dot-zero{fill:var(--line);stroke:#fff;stroke-width:1;}
.line-chart .lbl{font-size:10px;fill:var(--sub);text-anchor:middle;}
.line-chart .amt{font-size:10px;fill:var(--text);text-anchor:middle;font-weight:600;}
.line-chart .gl{stroke:var(--line);stroke-width:1;stroke-dasharray:3 3;}
.sb-row{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13px;}
.sb-label{width:76px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sb-track{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden;}
.sb-fill{height:100%;background:var(--primary);border-radius:4px;}
.sb-val{width:80px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums;flex-shrink:0;}
/* pie */
.pie-wrap{display:flex;align-items:center;gap:16px;}
.pie{width:120px;height:120px;border-radius:50%;flex-shrink:0;position:relative;}
.pie-hole{position:absolute;inset:22px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;}
.pie-total{font-size:13px;font-weight:700;}
.pie-cap{font-size:10px;color:var(--sub);}
.pie-legend{flex:1;min-width:0;}
.pie-li{display:flex;align-items:center;gap:6px;padding:4px 0;font-size:12px;}
.pie-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.pie-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pie-pct{font-weight:600;color:var(--sub);}
/* sheet */
.sheet-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s;}
.sheet-mask.show{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--sheet);border-radius:20px 20px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,.35,1);max-height:82vh;overflow-y:auto;}
.sheet.show{transform:translateY(0);}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.sheet-head .st{font-size:17px;font-weight:700;}
.sheet select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:16px;color:var(--text);}
.clear-count{font-size:14px;color:var(--danger,#e74c3c);margin-top:12px;font-weight:600;}
.btn-primary.danger{background:#e74c3c;}
.sheet-head button{border:none;background:none;color:var(--primary);font-size:15px;font-weight:600;cursor:pointer;}
.cat-chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;-webkit-overflow-scrolling:touch;}
.cc{padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);font-size:13px;white-space:nowrap;cursor:pointer;flex-shrink:0;}
.cc.active{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600;}
.src-tag{font-size:11px;color:var(--sub);background:var(--line);padding:2px 8px;border-radius:8px;display:inline-block;margin-top:6px;}
/* toast */
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:rgba(0,0,0,.78);color:#fff;padding:11px 22px;border-radius:24px;font-size:14px;z-index:99;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;max-width:86vw;overflow:hidden;text-overflow:ellipsis;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
  <!-- 禁止双指缩放 / 双击缩放（iOS Safari 忽略 viewport user-scalable） -->
  <script>
  document.addEventListener('gesturestart', function(e){ e.preventDefault(); }, {passive:false});
  document.addEventListener('gesturechange', function(e){ e.preventDefault(); }, {passive:false});
  document.addEventListener('gestureend', function(e){ e.preventDefault(); }, {passive:false});
  document.addEventListener('dblclick', function(e){ e.preventDefault(); }, {passive:false});
  document.addEventListener('touchmove', function(e){
    if(e.touches.length > 1) e.preventDefault();
  }, {passive:false});
  </script>
</head>
<body>

<header>
  <div class="h-inner">
    <div>
      <div class="h-title" id="hTitle">记一笔</div>
      <div class="h-sub" id="hSub"></div>
    </div>
    <div class="h-nav" id="hNav" style="display:none">
      <button id="prevM" onclick="setMonth(-1)">‹</button>
      <div class="h-date-pill">
        <select id="listYearSel" onchange="goListYear(this.value)"></select>
        <span class="h-pill-sep">/</span>
        <select id="monthSelect" onchange="goMonth(this.value)"></select>
      </div>
      <button id="nextM" onclick="setMonth(1)">›</button>
      <button id="goTodayBtn" class="h-today" onclick="goToday()">本月</button>
    </div>
  </div>
</header>

<main>
  <!-- 记账 -->
  <section id="page-add" class="page active">
    <div class="amount-wrap">
      <span class="sym" id="amtSym">−</span>
      <input id="amountInput" type="text" inputmode="decimal" placeholder="0.00" autocomplete="off">
      <span class="amt-inline">
        <button type="button" onclick="amtOp('+')">+</button>
        <button type="button" onclick="amtOp('-')">−</button>
        <button type="button" onclick="amtOp('c')">C</button>
      </span>
    </div>
    <div class="amt-hint">支持算式：12+3.5、100-20、25+8+2.5</div>
    <div class="seg" style="margin:14px 0 16px;">
      <button id="segExp" class="active" onclick="setType('expense')">支出</button>
      <button id="segInc" onclick="setType('income')">收入</button>
    </div>
    <div class="cat-grid" id="catGrid"></div>
    <div id="catMgr" class="cat-mgr" style="display:none">
      <div class="cat-mgr-list" id="catMgrList"></div>
      <div class="cat-mgr-add">
        <input id="catNewName" type="text" placeholder="新分类名称" maxlength="6">
        <button class="btn-ghost small" onclick="addCat()">添加</button>
      </div>
      <div class="cat-emoji-box">
        <div class="cat-emoji-title">选择图标</div>
        <div class="cat-emoji-grid" id="catEmojiGrid"></div>
      </div>
    </div>
    <div class="field">
      <label>商户 / 备注</label>

<script>
/* ============ 数据层 ============ */
const KEY_TXS = 'mbook_txs_v1', KEY_RULES = 'mbook_rules_v1', KEY_BUDGET = 'mbook_budget_v1', KEY_CATS = 'mbook_cats_v1';
let budget = load(KEY_BUDGET, {}); // { 'YYYY-M': fen }
let txs = load(KEY_TXS, []);
let learnedRules = load(KEY_RULES, []);

function load(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function saveTxs(){ localStorage.setItem(KEY_TXS, JSON.stringify(txs)); }
function saveRules(){ localStorage.setItem(KEY_RULES, JSON.stringify(learnedRules)); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

const DEFAULT_CATS = [
  {id:'餐饮',icon:'🍜'},{id:'交通',icon:'🚗'},{id:'购物',icon:'🛍️'},
  {id:'娱乐',icon:'🎮'},{id:'医疗',icon:'💊'},{id:'其他',icon:'❓'}
];
let CATS = load(KEY_CATS, DEFAULT_CATS);
function saveCats(){ localStorage.setItem(KEY_CATS, JSON.stringify(CATS)); }

/* 内置规则：高频消费先覆盖，学习规则可叠加 */
const DEFAULT_RULES = [
  ['瑞幸','餐饮'],['星巴克','餐饮'],['肯德基','餐饮'],['麦当劳','餐饮'],['海底捞','餐饮'],['汉堡','餐饮'],['烧烤','餐饮'],
  ['美团','餐饮'],['饿了么','餐饮'],['外卖','餐饮'],['奶茶','餐饮'],['咖啡','餐饮'],['蜜雪冰城','餐饮'],['茶百道','餐饮'],['食堂','餐饮'],['餐厅','餐饮'],['饭店','餐饮'],
  ['滴滴','交通'],['高德','交通'],['打车','交通'],['出租车','交通'],['地铁','交通'],['公交','交通'],['12306','交通'],['铁路','交通'],['高铁','交通'],['加油','交通'],['停车','交通'],['哈啰','交通'],
  ['淘宝','购物'],['天猫','购物'],['京东','购物'],['拼多多','购物'],['超市','购物'],['便利店','购物'],['商场','购物'],['优衣库','购物'],['无印良品','购物'],['唯品会','购物'],
  ['电费','其他'],['水费','其他'],['燃气','其他'],['房租','其他'],['物业','其他'],['宽带','其他'],
  ['电影','娱乐'],['KTV','娱乐'],['游戏','娱乐'],['steam','娱乐'],['腾讯视频','娱乐'],['爱奇艺','娱乐'],['哔哩哔哩','娱乐'],['B站','娱乐'],['会员','娱乐'],['网易云','娱乐'],
  ['医院','医疗'],['药房','医疗'],['药店','医疗'],['诊所','医疗'],['挂号','医疗'],['口腔','医疗'],
  ['书店','其他'],['课程','其他'],['培训','其他'],['得到','其他'],['知乎','其他'],['樊登','其他'],
  ['话费','其他'],['移动','其他'],['联通','其他'],['电信','其他'],['流量','其他']
];

function categorize(merchant){
  const m = merchant.toLowerCase();
  for(const r of learnedRules){ if(m.includes(r.kw.toLowerCase())) return r.cat; }
  for(const d of DEFAULT_RULES){ if(m.includes(d[0].toLowerCase())) return d[1]; }
  return null;
}
function extractKeyword(merchant){
  let m = merchant.trim();
  for(const p of ['支付宝-','微信支付-','美团-','收款方：','转账-']){ if(m.startsWith(p)){ m = m.slice(p.length); break; } }
  if(m.length < 2) return null;
  return m.slice(0, Math.min(m.length, 6));
}
function learn(merchant, cat){
  const kw = extractKeyword(merchant);
  if(!kw) return;
  const i = learnedRules.findIndex(r => r.kw === kw);
  if(i >= 0){ learnedRules[i].cat = cat; } else { learnedRules.push({kw, cat}); }
  saveRules(); renderRules();
}

/* ============ 金额工具（分，整数运算防精度错误） ============ */
function yuanToFen(s){
  s = String(s).replace(/[¥￥,\s]/g, '');
  if(!s) return null;
  if(/[+\-]$/.test(s)) return null; // 尾随运算符如 "3+"
  if(/^\+/.test(s)) return null;    // 纯加号开头
  // 支持加减运算：如 12+3.5、100-20、25+8+2.5
  const parts = s.split(/([+\-])/);
  let total = 0, sign = 1, valid = false;
  for(const p of parts){
    if(p === '+'){ sign = 1; continue; }
    if(p === '-'){ sign = -1; continue; }
    if(!p) continue;
    const m = p.match(/^(\d+)(?:\.(\d+))?$/);
    if(!m) return null;
    let cents = m[2] ? m[2].slice(0,2).padEnd(2,'0') : '00';
    total += sign * (parseInt(m[1],10)*100 + parseInt(cents,10));
    valid = true;
  }
  if(!valid) return null;
  return total;
}
function fmtFen(fen){
  const neg = fen < 0;
  const abs = Math.abs(fen);
  return (neg?'-':'') + (abs/100).toFixed(2);
}
function pad2(n){ return n<10 ? '0'+n : ''+n; }
function fmtDate(ts){ const d=new Date(ts); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function fmtDateTime(ts){
  const d=new Date(ts);
  return (d.getMonth()+1)+'月'+d.getDate()+'日 '+pad2(d.getHours())+':'+pad2(d.getMinutes());
}
function todayStr(){ const d=new Date(); return fmtDate(d.getTime()); }

/* ============ Tab ============ */
const TITLES = {add:'记一笔', list:'账单', stats:'统计', import:'自动记账'};
function switchTab(t){
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-'+t).classList.add('active');
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.t===t));
  document.getElementById('hTitle').textContent = TITLES[t];
  const nav = document.getElementById('hNav');
  if(t === 'list'){ nav.style.display='flex'; } else { nav.style.display='none'; }
  if(t === 'stats'){ fillStatSelects(); renderStats(); }
  if(t === 'list'){ fillMonthSelect(); fillCatFilter(); renderList(); }
  if(t === 'import') renderRules();
}

/* ============ 记账 ============ */
let curType = 'expense', curCat = '餐饮';
function setType(t){
  curType = t;
  document.getElementById('segExp').classList.toggle('active', t==='expense');
  document.getElementById('segInc').classList.toggle('active', t==='income');
  document.getElementById('amtSym').textContent = t==='expense' ? '−' : '+';
}
function buildCatGrid(){
  const g = document.getElementById('catGrid');
  g.innerHTML = '';
  CATS.forEach(c => {
    const d = document.createElement('div');
    d.className = 'cat-item' + (c.id===curCat ? ' active' : '');
    d.innerHTML = '<span class="ci">'+c.icon+'</span><span class="cn">'+c.id+'</span>';
    d.onclick = () => { curCat = c.id; g.querySelectorAll('.cat-item').forEach(x=>x.classList.remove('active')); d.classList.add('active'); };
    g.appendChild(d);
  });
  const mgr = document.createElement('div');
  mgr.className = 'cat-item cat-mgr-item-grid';
  mgr.innerHTML = '<span class="ci">➕</span><span class="cn">分类管理</span>';
  mgr.onclick = () => toggleCatMgr();
  g.appendChild(mgr);
}

/* ============ 分类管理 ============ */
var CAT_ICONS = ['🍜','🚗','🛍️','🎮','💊','🏠','📱','👕','🎁','✈️','🎬','📚','🐶','🐱','💄','⚽','☕','🍺','🧾','💼','👶','💍','🔧','🌿'];
var curCatIcon = '🏷️';
function renderCatEmoji(){
  const g = document.getElementById('catEmojiGrid');
  if(!g) return;
  g.innerHTML = '';
  CAT_ICONS.forEach(ic => {
    const d = document.createElement('div');
    d.className = 'cat-emoji' + (ic===curCatIcon ? ' active' : '');
    d.textContent = ic;
    d.onclick = () => { curCatIcon = ic; renderCatEmoji(); };
    g.appendChild(d);
  });
}
function toggleCatMgr(){
  const m = document.getElementById('catMgr');
  const show = m.style.display === 'none';
  m.style.display = show ? '' : 'none';
  if(show){ renderCatMgr(); renderCatEmoji(); }
}
function renderCatMgr(){
  const box = document.getElementById('catMgrList');
  box.innerHTML = '';
  CATS.forEach(c => {
    const it = el('div','cat-mgr-item', '');
    const ic = el('button','ic','');
    ic.textContent = c.icon;
    ic.title = '点击更换图标';
    ic.onclick = () => {
      const next = CAT_ICONS[(CAT_ICONS.indexOf(c.icon)+1) % CAT_ICONS.length];
      c.icon = next; saveCats(); renderCatMgr(); buildCatGrid();
    };
    const nm = el('span','nm', c.id);
    const del = el('button','del','✕');
    del.onclick = () => delCat(c.id);
    it.appendChild(ic); it.appendChild(nm); it.appendChild(del);
    box.appendChild(it);
  });
}
function addCat(){
  const n = document.getElementById('catNewName').value.trim();
  const ic = curCatIcon;
  if(!n){ toast('请输入分类名称'); return; }
  if(CATS.some(c => c.id === n)){ toast('分类已存在'); return; }
  CATS.push({id:n, icon:ic});
  saveCats();
  document.getElementById('catNewName').value = '';
  curCatIcon = '🏷️'; renderCatEmoji();
  renderCatMgr(); buildCatGrid(); fillCatFilter();
  toast('已添加分类：'+n);
}
function delCat(id){
  if(id === '其他'){ toast('「其他」分类不可删除'); return; }
  if(!confirm('删除分类「'+id+'」？该分类下的账单会保留，但显示为 ❓')) return;
  CATS = CATS.filter(c => c.id !== id);
  saveCats();
  renderCatMgr(); buildCatGrid(); fillCatFilter();
  toast('已删除分类：'+id);
}

function amtOp(op){
  const inp = document.getElementById('amountInput');
  if(op === 'c'){ inp.value = ''; inp.focus(); return; }
  const v = inp.value.trim();
  // 末尾已有运算符则替换，避免 "12++"
  if(/[+\-]$/.test(v)) inp.value = v.slice(0,-1) + op;
  else inp.value = v + op;
  inp.focus();
}
function saveManual(){
  const fen = yuanToFen(document.getElementById('amountInput').value);
  if(!fen || fen <= 0){ toast('请输入正确的金额'); return; }
  const merchant = document.getElementById('merchantInput').value.trim();
  const note = document.getElementById('noteInput').value.trim();
  const auto = merchant ? categorize(merchant) : null;
  let cat = auto || curCat;
  /* 学习：用户选了分类且与自动分类不同（且不是"其他"）→ 记住用户的选择 */
  if(merchant && curCat !== '其他' && curCat !== auto) learn(merchant, curCat);
  const dv = document.getElementById('dateInput').value;
  let ts = Date.now();
  if(dv){ const d = new Date(dv+'T00:00:00'); const n = new Date(); ts = new Date(d.getFullYear(), d.getMonth(), d.getDate(), n.getHours(), n.getMinutes()).getTime(); }
  txs.push({id:uid(), fen, type:curType, cat, merchant, note, date:ts, source:'manual', externalID:'', createdAt:Date.now()});
  saveTxs();
  document.getElementById('amountInput').value = '';
  document.getElementById('merchantInput').value = '';
  document.getElementById('noteInput').value = '';
  document.getElementById('autoTip').textContent = '';
  toast('已记账 ✓');
  fillMonthSelect();
  renderList();
}
document.getElementById('merchantInput').addEventListener('input', function(){
  const auto = categorize(this.value.trim());
  document.getElementById('autoTip').textContent = auto ? '📌 自动分类：'+auto : '';
});

/* ============ 列表 ============ */
let viewY = new Date().getFullYear(), viewM = new Date().getMonth();
let filter = 'all', searchQ = '', catF = '', amtMinF = null, amtMaxF = null;
const WEEK = ['周日','周一','周二','周三','周四','周五','周六'];
function txYears(){
  const years = new Set(txs.map(t => new Date(t.date).getFullYear()));
  years.add(new Date().getFullYear()); // 永远包含今年
  if(!years.size) return [new Date().getFullYear()];
  const min = Math.min(...years), max = Math.max(...years);
  const out = [];
  for(let y = min; y <= max; y++) out.push(y); // 连续覆盖，中间空年也显示
  return out;
}
function fillMonthSelect(){
  const ys = document.getElementById('listYearSel');
  const sel = document.getElementById('monthSelect');
  const years = txYears();
  if(!years.includes(viewY)) viewY = years[years.length-1];
  let yh = '';
  for(const y of years){ yh += '<option value="'+y+'"'+(y===viewY?' selected':'')+'>'+y+'年</option>'; }
  ys.innerHTML = yh;
  let mh = '';
  for(let m = 0; m < 12; m++){
    const v = viewY+'-'+m;
    const selAttr = (m===viewM) ? ' selected' : '';
    mh += '<option value="'+v+'"'+selAttr+'>'+(m+1)+'月</option>';
  }
  sel.innerHTML = mh;
}
function goListYear(y){
  viewY = parseInt(y);

  fillMonthSelect();

function renderList(){
  const years = txYears();
  if(!years.includes(viewY)) viewY = years[years.length-1];
  document.getElementById('listYearSel').value = viewY;
  document.getElementById('monthSelect').value = viewY+'-'+viewM;
  document.getElementById('listYearSel').value = String(viewY);
  const monthTxs = txs.filter(t => { const d = new Date(t.date); return d.getFullYear()===viewY && d.getMonth()===viewM; });
  const exp = monthTxs.filter(t=>t.type==='expense').reduce((a,t)=>a+t.fen,0);
  const inc = monthTxs.filter(t=>t.type==='income').reduce((a,t)=>a+t.fen,0);
  document.getElementById('sumExp').textContent = '−¥'+fmtFen(exp);
  document.getElementById('sumInc').textContent = '+¥'+fmtFen(inc);
  const list = monthTxs.filter(t => {
    if(filter !== 'all' && t.type !== filter) return false;
    if(searchQ){ const s = (t.merchant+' '+t.note).toLowerCase(); if(!s.includes(searchQ)) return false; }
    if(catF && t.cat !== catF) return false;
    if(amtMinF !== null && t.fen < amtMinF) return false;
    if(amtMaxF !== null && t.fen > amtMaxF) return false;
    return true;
  }).sort((a,b) => b.date - a.date);
  const box = document.getElementById('txList');
  box.innerHTML = '';
  if(!list.length){ box.appendChild(el('div','empty', filter==='all' && !searchQ ? '这个月还没有账单，去记一笔吧 ✨' : '没有匹配的账单')); return; }
  /* 按天分组 */
  const groups = new Map();
  for(const t of list){
    const key = fmtDate(t.date);
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(t);
  }
  const frag = document.createDocumentFragment();
  for(const [day, arr] of groups){
    const dayExp = arr.filter(t=>t.type==='expense').reduce((a,t)=>a+t.fen,0);
    const g = el('div','day-group');
    const head = el('div','day-head');
    const dd = new Date(day+'T00:00:00');
    const ds = el('span','ds', dd.getFullYear()+'年'+(dd.getMonth()+1)+'月'+dd.getDate()+'日 '+WEEK[dd.getDay()]);
    const dv = el('span','dv', dayExp ? '支出 −¥'+fmtFen(dayExp) : '');
    head.append(ds, dv);
    g.appendChild(head);
    arr.forEach(t => g.appendChild(txRow(t)));
    frag.appendChild(g);
  }
  box.appendChild(frag);
}

/* ============ CSV 解析（引号转义状态机） ============ */
function parseCSV(text){
  text = text.replace(/^\uFEFF/, '');
  const rows = []; let row = [], field = '', inQuotes = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field = ''; }
      else if(c === '\n' || c === '\r'){
        if(c === '\r' && text[i+1] === '\n') i++;
        row.push(field); field = '';
        if(!(row.length === 1 && row[0] === '')) rows.push(row);
        row = [];
      } else field += c;
    }
  }
  if(field !== '' || row.length){ row.push(field); rows.push(row); }
  return rows;
}
function norm(s){ return s.replace(/（/g,'(').replace(/）/g,')').trim(); }
function colIdx(header, name){
  const n = norm(name);
  for(let i = 0; i < header.length; i++) if(norm(header[i]) === n) return i;
  return -1;
}
/* 支付宝：交易号,商家订单号,交易创建时间,付款时间,最近修改时间,交易来源地,类型,交易对方,商品名称,金额（元）,收/支,交易状态,服务费（元）,成功退款（元）,备注,资金状态 */
function parseAlipay(rows){
  const hi = rows.findIndex(r => r.some(c => c.includes('交易号')));
  if(hi < 0) return null;
  const h = rows[hi];
  const ci = {
    id: colIdx(h,'交易号'), amount: colIdx(h,'金额(元)'), type: colIdx(h,'收/支'),
    time: colIdx(h,'交易创建时间'), merchant: colIdx(h,'交易对方'), note: colIdx(h,'商品名称'), status: colIdx(h,'交易状态')
  };
  if(ci.id<0 || ci.amount<0 || ci.type<0 || ci.time<0 || ci.merchant<0 || ci.status<0) return null;
  const bills = [];
  for(let r = hi+1; r < rows.length; r++){
    const row = rows[r];
    if(row.length <= Math.max(ci.amount, ci.status)) continue;
    if(!row[ci.status].includes('成功')) continue;
    const fen = yuanToFen(row[ci.amount]);
    if(fen === null || fen <= 0) continue;
    const t = row[ci.type];
    if(!t.includes('支出') && !t.includes('收入')) continue;
    const d = new Date(row[ci.time].replace(' ','T'));
    if(isNaN(d.getTime())) continue;
    bills.push({fen, type: t.includes('支出') ? 'expense':'income', cat: categorize(row[ci.merchant]) || '其他',
      merchant: row[ci.merchant], note: row[ci.note] || '', date: d.getTime(), source:'alipay', externalID: row[ci.id]});
  }
  return bills.length ? bills : null;
}
/* 微信：交易时间,交易类型,交易对方,商品,收/支,金额(元),支付方式,当前状态,交易单号,商户单号,备注 */
function parseWeChat(rows){
  const hi = rows.findIndex(r => r.some(c => c.includes('交易时间')));
  if(hi < 0) return null;
  const h = rows[hi];
  const ci = {
    time: colIdx(h,'交易时间'), merchant: colIdx(h,'交易对方'), note: colIdx(h,'商品'),
    type: colIdx(h,'收/支'), amount: colIdx(h,'金额(元)'), status: colIdx(h,'当前状态'), id: colIdx(h,'交易单号')
  };
  if(ci.time<0 || ci.merchant<0 || ci.type<0 || ci.amount<0 || ci.status<0) return null;
  const bills = [];
  for(let r = hi+1; r < rows.length; r++){
    const row = rows[r];
    if(row.length <= Math.max(ci.amount, ci.status)) continue;
    if(!row[ci.status].includes('支付成功')) continue;
    const fen = yuanToFen(row[ci.amount]);
    if(fen === null || fen <= 0) continue;
    const t = row[ci.type];
    if(t !== '支出' && t !== '收入') continue;
    const d = new Date(row[ci.time].replace(' ','T'));
    if(isNaN(d.getTime())) continue;
    bills.push({fen, type: t === '支出' ? 'expense':'income', cat: categorize(row[ci.merchant]) || '其他',
      merchant: row[ci.merchant], note: row[ci.note] || '', date: d.getTime(), source:'wechat', externalID: row[ci.id]});
  }
  return bills.length ? bills : null;
}
function decodeGBK(u8){
  /* GBK/GB2312 解码（iOS Safari 不支持 TextDecoder gb18030，此表覆盖 0xA1A1-0xF7FE 常用区） */
  let out = '';
  for(let i=0;i<u8.length;i++){
    const b = u8[i];
    if(b < 0x80){ out += String.fromCharCode(b); continue; }
    if(i+1 >= u8.length) break;
    const b2 = u8[++i];
    if(b < 0xA1 || b > 0xF7 || b2 < 0xA1 || b2 > 0xFE){ out += '\uFFFD'; continue; }
    out += GBK_V[(b-0xA1)*94 + (b2-0xA1)] || '\uFFFD';
  }
  return out;
}

function parseFreeText(text){
  // 尝试从自由文本提取账单（App 复制的交易记录、聊天记录等）
  const lines = text.split(/[\r\n]+/).filter(l => l.trim());
  const bills = [];
  const amountRe = /([+-]?)(¥|￥|\$)?\s*(\d{1,3}(?:,\d{3})*\.\d{2})/g;
  const dateRe = /(20\d{2}[-/.年]\d{1,2}[-/.月]\d{1,2}日?)/g;
  for(const line of lines){
    const amounts = [...line.matchAll(amountRe)];
    if(!amounts.length) continue;
    const dm = line.match(dateRe);
    if(!dm) continue;
    for(const am of amounts){
      const val = parseFloat(am[3].replace(/,/g,''));
      if(!val || val <= 0) continue;
      const neg = /^-/.test(am[1]) || /(支出|消费|付款|支付|购买|转出|扣款)/.test(line);
      const income = /(收入|退款|入账|转入|收到|收款|红包)/.test(line) && !/(支出|付款|转出)/.test(line);
      const fen = Math.round(val*100);
      const type = neg || !income ? 'expense' : 'income';
      const date = dm[0].replace(/[年\/.]/g,'-').replace(/月/g,'-').replace(/日/g,'');
      const d = new Date(date.replace(/-/g,'/')+' 00:00:00');
      if(isNaN(d.getTime())) continue;
      const merchant = line.trim().slice(0,60);
      /* 去重 key：用行内容做哈希，避免同一段文字重复粘贴重复入账 */
      let h = 5381;
      for(let i=0;i<line.length;i++){ h = ((h*33) ^ line.charCodeAt(i)) >>> 0; }
      bills.push({fen, type, cat: categorize(merchant) || '其他', merchant, note: '', date: d.getTime(), source:'text', externalID: 't'+h.toString(36)});
    }
  }
  return bills.length ? bills : null;
}

document.getElementById('fileInput').addEventListener('change', async function(e){
  const f = e.target.files[0];
  if(!f) return;
  try{
    const buf = await f.arrayBuffer();
    let text = new TextDecoder('utf-8').decode(buf);
    if(text.includes('\uFFFD')){ /* UTF-8 解码出乱码 → 支付宝 CSV 是 GBK/GB18030 编码 */
      try{
        text = new TextDecoder('gb18030').decode(buf); /* 桌面浏览器支持 */
      }catch(err){
        text = decodeGBK(new Uint8Array(buf)); /* iOS Safari 不支持 gb18030，用内置表解码 */
      }
    }
    handleParsed(text);
  }catch(err){ toast('读取文件失败：'+(err && err.message || err)); }
  e.target.value = '';
});

function renderLineChart(container, bars, max){
  container.classList.add('line-chart');
  container.classList.remove('bar-chart');
  const W = container.clientWidth || 340, H = 150, PAD = 6, TOP = 22, BOT = 22;
  const n = bars.length;
  const innerH = H - TOP - BOT;
  const x = i => n === 1 ? W/2 : PAD + i*(W-2*PAD)/(n-1);
  const y = v => TOP + innerH - (v/max)*innerH;
  const pts = bars.map((d,i) => [x(i), y(d.fen)]);
  let line = '';
  pts.forEach((p,i) => { line += (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)+' '; });
  /* 面积 */
  const area = pts.length > 1
    ? 'M'+pts[0][0].toFixed(1)+','+(TOP+innerH).toFixed(1)+' '+line+'L'+pts[pts.length-1][0].toFixed(1)+','+(TOP+innerH).toFixed(1)+' Z'
    : '';
  const spendDays = bars.filter(d=>d.fen>0).length;
  let svg = '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">';
  /* 网格线 */
  [0, 0.5, 1].forEach(f => {
    const gy = TOP + innerH*(1-f);
    svg += '<line class="gl" x1="0" y1="'+gy.toFixed(1)+'" x2="'+W+'" y2="'+gy.toFixed(1)+'"/>';
  });
  if(area) svg += '<path class="ln-area" d="'+area+'"/>';
  if(line) svg += '<path class="ln" d="'+line+'"/>';
  /* 数据点 + 日期 + 金额 */
  pts.forEach((p,i) => {
    const d = bars[i];
    const dot = d.fen > 0 ? 'dot' : 'dot-zero';
    svg += '<circle class="'+dot+'" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3"/>';
    /* 日期标签隔 5 天显示，避免重叠 */
    if(i%5===0 || i===n-1) svg += '<text class="lbl" x="'+p[0].toFixed(1)+'" y="'+(H-6)+'">'+d.label+'</text>';
    /* 金额：有支出才显示；支出天数多时隔天显示 */
    if(d.fen > 0 && (spendDays <= 10 || i%2===0)){
      svg += '<text class="amt" x="'+p[0].toFixed(1)+'" y="'+(p[1]-7).toFixed(1)+'">¥'+fmtFen(d.fen)+'</text>';
    }
  });
  svg += '</svg>';
  container.innerHTML = svg;
}
function renderStats(){
  const now = new Date();
  const y = statY, m = statM;
  const inRange = statMode === 'year'
    ? t => new Date(t.date).getFullYear()===y
    : t => { const d = new Date(t.date); return d.getFullYear()===y && d.getMonth()===m; };
  const rangeTxs = txs.filter(inRange);
  const exp = rangeTxs.filter(t=>t.type==='expense').reduce((a,t)=>a+t.fen,0);
  const inc = rangeTxs.filter(t=>t.type==='income').reduce((a,t)=>a+t.fen,0);
  const pre = statMode==='year' ? y+'年' : y+'年'+(m+1)+'月';
  document.getElementById('stLabel').textContent = pre+'支出';
  document.getElementById('stExp').textContent = '¥'+fmtFen(exp);
  document.getElementById('stInc').textContent = '¥'+fmtFen(inc);
  document.getElementById('stBal').textContent = '¥'+fmtFen(inc-exp);
  document.getElementById('catBrkTitle').textContent = pre+'支出分类';
  document.getElementById('incBrkTitle').textContent = pre+'收入分类';
  renderBudget(exp);
  /* 支出趋势：7天 / 月 / 年 */
  const chart = document.getElementById('barChart');
  chart.innerHTML = '';
  const bars = [];
  const mk = (s,e) => txs.filter(t => t.type==='expense' && t.date>=s && t.date<e).reduce((a,t)=>a+t.fen,0);
  if(trend === '7d'){
    for(let i = 6; i >= 0; i--){
      const d = new Date(); d.setDate(d.getDate()-i);
      const s = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
      bars.push({label:(d.getMonth()+1)+'/'+d.getDate(), fen:mk(s, s+86400000)});
    }
  } else if(trend === 'month'){
    const d0 = new Date(y, m, 1);
    const daysInM = new Date(y, m+1, 0).getDate();
    for(let dd = 1; dd <= daysInM; dd++){
      const s = new Date(y, m, dd).getTime();
      bars.push({label:dd, fen:mk(s, s+86400000)});
    }
  } else { // year: 12 个月
    for(let mo = 0; mo < 12; mo++){
      const s = new Date(y, mo, 1).getTime();
      bars.push({label:(mo+1)+'月', fen:mk(s, new Date(y, mo+1, 1).getTime())});
    }
  }
  const max = Math.max(...bars.map(d=>d.fen), 1);
  if(trend === 'month'){
    /* 月趋势：折线图 */
    renderLineChart(chart, bars, max);
  } else {
    bars.forEach(d => {
      const col = el('div','bar-col');
      const bv = el('div','bv', d.fen ? '¥'+fmtFen(d.fen) : '');
      const bar = el('div','bar');
      bar.style.height = Math.max(2, Math.round(d.fen/max*100)) + '%';
      col.append(bar, bv, el('div','bl', d.label));
      chart.appendChild(col);
    });
  }
  /* 分类占比 */
  const brk = document.getElementById('catBreak');
  brk.innerHTML = '';
  const byCat = {};
  rangeTxs.filter(t=>t.type==='expense').forEach(t => { byCat[t.cat] = (byCat[t.cat]||0) + t.fen; });
  const entries = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  if(!entries.length){ brk.appendChild(el('div','empty',pre+'暂无支出')); }
  const total = entries.reduce((a,e)=>a+e[1],0);
  entries.forEach(([cat, fen]) => {
    const row = el('div','sb-row');
    row.appendChild(el('span','sb-label', catIcon(cat)+' '+cat));
    const track = el('div','sb-track');
    const fill = el('div','sb-fill');
    fill.style.width = Math.max(2, Math.round(fen/total*100)) + '%';
    track.appendChild(fill);
    row.appendChild(track);
    row.appendChild(el('span','sb-val', '¥'+fmtFen(fen)));
    brk.appendChild(row);
  });
  /* 收入分类占比 */
  const ibrk = document.getElementById('incBreak');
  ibrk.innerHTML = '';
  const byIncCat = {};
  rangeTxs.filter(t=>t.type==='income').forEach(t => { byIncCat[t.cat] = (byIncCat[t.cat]||0) + t.fen; });
  const ientries = Object.entries(byIncCat).sort((a,b)=>b[1]-a[1]);
  if(!ientries.length){ ibrk.appendChild(el('div','empty',pre+'暂无收入')); }
  const itotal = ientries.reduce((a,e)=>a+e[1],0);
  ientries.forEach(([cat, fen]) => {
    const row = el('div','sb-row');
    row.appendChild(el('span','sb-label', catIcon(cat)+' '+cat));
    const track = el('div','sb-track');
    const fill = el('div','sb-fill');
    fill.style.width = Math.max(2, Math.round(fen/itotal*100)) + '%';
    track.appendChild(fill);
    row.appendChild(track);
    row.appendChild(el('span','sb-val', '¥'+fmtFen(fen)));
    ibrk.appendChild(row);
  });
  /* 分类占比饼图 */
  renderPie();
}
let pieType = 'expense';
const PIE_COLORS = ['#5b8ff9','#61c0a8','#f6bd16','#e8684a','#6dc8ec','#9270ca','#ff9d4d','#9aa5b1','#5ad8a6','#f6903d'];
function setPie(tp){
  pieType = tp;
  document.getElementById('pieExp').classList.toggle('active', tp==='expense');
  document.getElementById('pieInc').classList.toggle('active', tp==='income');
  renderPie();
}
function renderPie(){
  const y = statY, m = statM;
  const inRange = statMode === 'year'
    ? t => new Date(t.date).getFullYear()===y
    : t => { const d = new Date(t.date); return d.getFullYear()===y && d.getMonth()===m; };
  const rangeTxs = txs.filter(inRange);
  const byCat = {};
  rangeTxs.filter(t=>t.type===pieType).forEach(t => { byCat[t.cat] = (byCat[t.cat]||0) + t.fen; });
  const entries = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const total = entries.reduce((a,e)=>a+e[1],0);
  const pre = statMode==='year' ? y+'年' : y+'年'+(m+1)+'月';
  document.getElementById('pieTitle').textContent = pre+(pieType==='expense'?'支出':'收入')+'占比';
  const pie = document.getElementById('pieChart');
  const legend = document.getElementById('pieLegend');
  if(!total){
    pie.style.background = 'var(--line)';
    pie.innerHTML = '';
    legend.innerHTML = '<div class="empty">暂无数据</div>';
    return;
  }
  // conic-gradient: 每段按占比分配角度
  let acc = 0;
  const stops = [];
  entries.forEach((e,i) => {
    const deg = e[1]/total*360;
    stops.push(PIE_COLORS[i%PIE_COLORS.length]+' '+acc+'deg '+(acc+deg)+'deg');
    acc += deg;
  });
  pie.style.background = 'conic-gradient('+stops.join(',')+')';
  pie.innerHTML = '<div class="pie-hole"><span class="pie-total">¥'+fmtFen(total)+'</span><span class="pie-cap">'+(pieType==='expense'?'支出':'收入')+'</span></div>';
  legend.innerHTML = '';
  entries.forEach((e,i) => {
    const row = el('div','pie-li');
    row.appendChild(el('span','pie-dot', '', 'background:'+PIE_COLORS[i%PIE_COLORS.length]));
    row.appendChild(el('span','pie-name', catIcon(e[0])+' '+e[0]));
    row.appendChild(el('span','pie-pct', Math.round(e[1]/total*100)+'%'));
    legend.appendChild(row);
  });
}

function importBackup(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(!data || !Array.isArray(data.txs)){ toast('不是有效的备份文件'); return; }
      let addT = 0, addR = 0;
      const ids = new Set(txs.map(t=>t.id));
      for(const t of data.txs){ if(!ids.has(t.id)){ txs.push(t); ids.add(t.id); addT++; } }
      const kws = new Set(learnedRules.map(r=>r.kw));
      for(const r of (data.rules||[])){ if(!kws.has(r.kw)){ learnedRules.push(r); kws.add(r.kw); addR++; } }
      saveTxs(); saveRules(); renderList(); renderRules();
      toast('导入完成：新增 '+addT+' 笔账单，'+addR+' 条规则');
    }catch(e){ toast('备份文件解析失败'); }
  };
  reader.readAsText(file);
}
function csvEsc(s){
  s = String(s||'').replace(/"/g,'""');
  return /[",\n]/.test(s) ? '"'+s+'"' : s;
